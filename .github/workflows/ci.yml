# Required checks on every pull request and on main (test plan §6).
#
# - Types, lint (0 errors), unit tests.
# - Database tests, data guard scenarios and the schema drift check against a
#   real Postgres 18 (production's version), with DATA_GUARD_REQUIRE_DB=1 so
#   they can't be skipped silently.
# - Production build.
# - The web journeys and the players' app journeys, each in a real browser
#   against a production build on a fresh Postgres 18.
#
# Monorepo (pnpm workspaces): the app is apps/web, the schema and
# migrations packages/db.
#
# Nothing here talks to production: no secrets are used (one exception, on
# main only: the Android build's Firebase file, GOOGLE_SERVICES_JSON, which
# is configuration for the app and talks to nothing), side effects are off
# outside production (lib/side-effects.ts), and the database is the service
# container below.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATA_GUARD_TEST_URL: postgres://postgres:postgres@localhost:5432/dg_test
      DATA_GUARD_REQUIRE_DB: "1"
      ROLES_TEST_URL: postgres://postgres:postgres@localhost:5432/dg_test
      # The S3-compatible storage provider's contract runs against the S3
      # server started below, and can't be skipped silently
      # (tests/storage-s3.test.ts). Throwaway credentials, nothing secret.
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_ACCESS_KEY_ID: testaccess
      S3_TEST_SECRET_ACCESS_KEY: testsecret
      STORAGE_REQUIRE_S3: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Versity S3 Gateway: a small open-source S3 server that checks request
      # signatures, serving a temporary folder. (MinIO no longer publishes images.)
      - name: S3-compatible server for the storage contract
        run: |
          mkdir -p "$RUNNER_TEMP/s3-data"
          docker run -d --name s3 -p 9000:9000 -v "$RUNNER_TEMP/s3-data:/data" \
            versity/versitygw:v1.11.0 \
            --access "$S3_TEST_ACCESS_KEY_ID" --secret "$S3_TEST_SECRET_ACCESS_KEY" --port :9000 posix /data
          # Any HTTP answer means it is up (an unsigned request gets a 403).
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - name: Vercel ignored-build-step rules (preview policy)
        run: bash scripts/vercel-ignore.test.sh
      - name: Types
        run: pnpm --filter web typecheck
      - name: Types (shared packages)
        run: pnpm --filter "./packages/*" typecheck
      - name: Old apps keep working (the API contract against main's)
        run: |
          git fetch --no-tags --depth=1 origin main
          pnpm --filter @luvallplay/api compat
      - name: Types (Sanity Studio)
        run: pnpm --filter studio typecheck
      - name: Types (website Studio)
        run: pnpm --filter site-studio typecheck
      - name: Lint (0 errors, 0 warnings)
        run: pnpm --filter web exec eslint . --max-warnings 0
      - name: Tests (unit, database, data guard, schema drift, golden master)
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build

  # The public website (apps/site): its own app, its own small database.
  # Gate R (test plan §9): both languages complete, links, meta, axe, motion,
  # budgets and the forms end to end, against a production build.
  site:
    name: Website (types, lint, tests, build, gate R)
    # Pinned: Playwright's --with-deps can't install its fonts on ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: site_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SITE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/site_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm --filter site typecheck
      - name: Lint (0 errors, 0 warnings)
        run: pnpm --filter site lint
      - name: Tests (both languages complete, content rules, forms, routing)
        run: pnpm --filter site test
      - name: Build (applies the site database schema first)
        run: pnpm --filter site build
      - name: Browser for the end-to-end checks
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Gate R, end to end
        run: pnpm --filter site e2e

  # The web journeys (test plan §3.8; audit C2): A1–A7 accounts and admin,
  # M1–M5 membership, G1–G2 the Arena, T1 two clubs at the routes, API1–23
  # the players' app API, and S2 for every optional module, in a real browser
  # against a production build of apps/web on a fresh database built from
  # the migrations. Synthetic people only; email is captured, never sent.
  journeys:
    name: Web journeys (accounts, membership, Arena, two clubs, API, modules)
    # Pinned: Playwright's --with-deps can't install its fonts on ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PG_URL: postgres://postgres:postgres@localhost:5432
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (apps/web, end-to-end build)
        run: E2E_BUILD=1 pnpm --filter web build
      - name: Browser for the end-to-end checks
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Journeys
        working-directory: apps/web
        run: node --test --test-concurrency=1 --test-timeout=240000 tests/e2e/journeys.mjs
        env:
          # Every screen at the five widths, for people to look at.
          E2E_SHOTS: ${{ github.workspace }}/web-screens
      - name: Screenshots of every screen (the "web-screens" artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screens
          path: web-screens
          if-no-files-found: ignore
          retention-days: 14

  # The players' app (apps/app): a client-side app on the typed API.
  # Phase 4 gate (test plan §9): the app's own rules, the performance budget,
  # and its journeys against the real API (a production build of apps/web on
  # a fresh database) with the app served from its own origin, so CORS and
  # the page's Content-Security-Policy are the real ones.
  app:
    name: Players' app (types, tests, build, budget, journeys)
    # Pinned: Playwright's --with-deps can't install its fonts on ubuntu-26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PG_URL: postgres://postgres:postgres@localhost:5432
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm --filter app typecheck
      - name: Tests (theme, window classes, tabs and modules, storage, messages in both languages)
        run: pnpm --filter app test
      - name: Build
        run: pnpm --filter app build
      - name: Performance budget (app shell at most 150 KB gzipped JavaScript)
        run: pnpm --filter app budget
      - name: Build the API (apps/web, end-to-end build)
        run: E2E_BUILD=1 pnpm --filter web build
      - name: Browser for the end-to-end checks
        run: |
          npm install -g playwright@1
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Journeys (sign-in, the club's look, switching clubs, modules, layout, axe)
        run: pnpm --filter app e2e
        env:
          # Every screen at the five window widths, for people to look at.
          E2E_SHOTS: ${{ github.workspace }}/app-screens
      - name: Screenshots of every screen (the "app-screens" artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screens
          path: app-screens
          if-no-files-found: ignore
          retention-days: 14

  # The store app's Android shell (apps/native): the players' app bundled
  # into the Capacitor project, compiled to a debug APK. Proves the project
  # builds on every pull request; signing and the release bundle (AAB) come
  # with the release pipeline (build plan §4.5.1), and need Play's keys.
  android:
    name: Android shell (types, tests, debug build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Gradle's downloads are kept between runs. Maven Central answers shared
      # CI machines with "429 Too Many Requests" when it is busy, so the less
      # the build has to fetch, the better; `restore-keys` reuses the last
      # run's downloads even when the build files changed (a new plugin).
      - name: Gradle's downloads, kept between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('apps/native/android/**/*.gradle', 'apps/native/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: gradle-android-
      - run: pnpm install --frozen-lockfile
      - name: Types and the shell's identity and settings
        run: pnpm --filter native typecheck && pnpm --filter native test
      # Only on main, never on a pull request: the Firebase project's file
      # comes from the GOOGLE_SERVICES_JSON secret. Without the secret the
      # step writes nothing and the build has no push notifications.
      - name: The Firebase file, from its secret (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --filter native google-services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: The players' app, built for the shell
        run: pnpm --filter native web
        env:
          # A stand-in host: this build is only compiled, never published.
          NATIVE_API_BASE: https://api.luvallplay.com
      - name: Copy it into the Android project
        run: pnpm --filter native sync:android
      - name: Debug build (APK)
        # What isn't cached yet comes from Google's copy of Maven Central
        # first (.github/gradle/maven-mirror.init.gradle), not from Maven
        # Central itself, which rate-limits these machines.
        working-directory: apps/native/android
        run: ./gradlew --init-script "$GITHUB_WORKSPACE/.github/gradle/maven-mirror.init.gradle" assembleDebug
      - name: The debug APK (the "android-debug-apk" artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
