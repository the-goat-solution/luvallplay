# Required checks on every pull request and on main (test plan §6).
#
# - Types, lint (0 errors), unit tests.
# - Database tests, data guard scenarios and the schema drift check against a
#   real Postgres 18 (production's version), with DATA_GUARD_REQUIRE_DB=1 so
#   they can't be skipped silently.
# - Production build.
#
# Monorepo (pnpm workspaces): the app is apps/web, the schema and
# migrations packages/db.
#
# Nothing here talks to production: no secrets are used, side effects are off
# outside production (lib/side-effects.ts), and the database is the service
# container below.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATA_GUARD_TEST_URL: postgres://postgres:postgres@localhost:5432/dg_test
      DATA_GUARD_REQUIRE_DB: "1"
      ROLES_TEST_URL: postgres://postgres:postgres@localhost:5432/dg_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm --filter web typecheck
      - name: Lint (0 errors)
        run: pnpm --filter web exec eslint .
      - name: Tests (unit, database, data guard, schema drift, golden master)
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build
